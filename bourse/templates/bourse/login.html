{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — BourseAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'bourse/css/style.css' %}">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
<div style="width:380px;">
  <div style="text-align:center;margin-bottom:32px;">
    <div style="font-family:var(--mono);font-size:28px;color:var(--blue);">Bourse<span style="color:var(--green)">AI</span></div>
    <div style="font-size:13px;color:var(--text2);margin-top:6px;">Plateforme d'analyse boursière</div>
  </div>
  <div class="chart-card" style="padding:28px;">
    {% if form.errors %}
    <div style="background:var(--red-dim);color:var(--red);padding:10px 14px;border-radius:8px;font-size:12px;margin-bottom:16px;">
      Identifiants incorrects.
    </div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="form-group" style="margin-bottom:14px;">
        <label class="form-label">Nom d'utilisateur</label>
        <input type="text" name="username" class="form-input" autofocus required>
      </div>
      <div class="form-group" style="margin-bottom:20px;">
        <label class="form-label">Mot de passe</label>
        <input type="password" name="password" class="form-input" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:10px;font-size:14px;">
        Se connecter
      </button>
    </form>
  </div>
  <div style="text-align:center;font-size:11px;color:var(--text3);margin-top:16px;font-family:var(--mono);">
    Données en direct via WebSocket Finnhub
  </div>
</div>
</body>
</html>
