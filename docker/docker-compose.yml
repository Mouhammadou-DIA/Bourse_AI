services:

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB:       bourse_db
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: ..
    command: daphne config.asgi:application --bind 0.0.0.0 --port 8000
    volumes:
      - ..:/app
      - static_volume:/app/staticfiles
    ports:
      - "8000:8000"  # Gardé pour dev, mais Nginx utilisera le port 80
    env_file:
      - ../.env
    environment:
      DB_HOST:   db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - ..:/app/media:/app/media
    depends_on:
      - web

  celery-worker:
    build: ..
    command: celery -A config worker --loglevel=info --concurrency=4
    volumes:
      - ..:/app
    env_file:
      - ../.env
    environment:
      DB_HOST:   db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - web

  celery-beat:
    build: ..
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - ..:/app
    env_file:
      - ../.env
    environment:
      DB_HOST:   db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - web

  celery-flux:
    build: ..
    command: >
      python -c "
      import django, os
      os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
      django.setup()
      from bourse.tasks.flux_websocket import demarrer_flux_finnhub
      demarrer_flux_finnhub()
      "
    volumes:
      - ..:/app
    env_file:
      - ../.env
    environment:
      DB_HOST:   db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  static_volume:
