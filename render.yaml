databases:
  - name: bourse-db
    plan: free

envVarGroups:
  - name: bourse-shared-env
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DEBUG
        value: "False"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FINNHUB_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_HOSTS
        value: bourse-app.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://bourse-app.onrender.com

services:
  # 0. Key Value (Redis/Valkey)
  - type: keyvalue
    name: bourse-redis
    plan: free
    ipAllowList: []

  # 1. Web Service (Django + Daphne pour WebSockets)
  - type: web
    name: bourse-app
    plan: free
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    preDeployCommand: "python manage.py migrate"
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bourse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bourse-redis
          property: connectionString
      - fromGroup: bourse-shared-env
